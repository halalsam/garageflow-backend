# Render Blueprint — free-tier demo of the GarageFlow API.
# Deploy: push this repo to GitHub, then in Render → "New +" → "Blueprint",
# pick this repo. Render reads this file and provisions both services.
#
# Free tier notes:
#  - The web service spins down after ~15 min idle; first request after that
#    cold-starts in ~30–60s. Fine for a client demo.
#  - The free Postgres instance expires after 30 days — recreate before then.
#  - The free Key Value (Redis) instance is non-persistent — fine here, it only
#    backs the socket.io pub/sub adapter (no durable data is stored in it).
#  - With S3_* set, uploads are presigned straight to S3 and survive restarts;
#    without it, files fall back to the container's ephemeral disk.
services:
  # Redis-compatible Key Value store backing the socket.io redis-adapter so
  # timeline broadcasts fan out across web instances. Free plan = no persistence,
  # internal-only (empty ipAllowList). Pub/sub only, no durable data.
  - type: keyvalue
    name: garageflow-redis
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    name: garageflow-api
    runtime: docker
    plan: free
    region: singapore # closest free region to India; change if you prefer
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Migrations run at container start (Dockerfile CMD) — Render's free tier
    # doesn't support preDeployCommand. SEED_ON_START gates the seed: it is
    # OFF because seed.ts clears ALL tables first (it deletes users, which
    # cascades to device tokens), so reseeding on every cold start / redeploy
    # wipes registered push tokens and any created data. Flip to "true" only
    # for a one-off reseed when you deliberately want fresh demo data.
    envVars:
      - key: SEED_ON_START
        value: "false"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: garageflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      # PUBLIC_URL is used to build absolute /uploads file URLs. Set this to the
      # service's own URL after the first deploy (Render shows it), or leave and
      # update later — it only affects image/audio links, not core data.
      - key: PUBLIC_URL
        sync: false
      # Internal connection string to the Key Value service above.
      - key: REDIS_URL
        fromService:
          name: garageflow-redis
          type: keyvalue
          property: connectionString
      # --- AWS S3 presigned uploads --------------------------------------------
      # When S3_BUCKET is set, photo uploads presign straight to S3. Leave
      # S3_ENDPOINT unset for AWS (it's only for S3-compatible stores like R2).
      # Set the secrets in the Render dashboard (sync: false).
      - key: S3_REGION
        value: ap-south-1 # Mumbai; must match the bucket's region
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Public base for served files. For AWS, set to
      # https://<bucket>.s3.<region>.amazonaws.com (or your CloudFront domain).
      - key: S3_PUBLIC_URL
        sync: false

databases:
  - name: garageflow-db
    plan: free
    region: singapore
    databaseName: garageflow
    user: garageflow
